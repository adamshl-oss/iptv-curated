name: Refresh and audit self-healing Algerian channels

on:
  workflow_dispatch:
    inputs:
      force_refresh:
        description: "Force official signed-source renewal"
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: write

concurrency:
  group: iptv-state-writer
  cancel-in-progress: false

jobs:
  refresh-and-audit:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node for YouTube challenges
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install resolver and real playback tools
        run: |
          brew install ffmpeg jq coreutils
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          pip install -U "yt-dlp[default]" curl_cffi bgutil-ytdlp-pot-provider
          git clone --depth 1 --branch 1.3.1 \
            https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git \
            "$RUNNER_TEMP/bgutil-ytdlp-pot-provider"
          cd "$RUNNER_TEMP/bgutil-ytdlp-pot-provider/server"
          npm ci
          npx tsc
          chmod +x "$GITHUB_WORKSPACE/scripts/test_stream.sh"
          chmod +x "$GITHUB_WORKSPACE/scripts/sustained_stream_gate.py"
          xcrun swiftc -O "$GITHUB_WORKSPACE/scripts/apple_avplayer_check.swift" \
            -o "$RUNNER_TEMP/apple-avplayer-check"
          echo "APPLE_AVPLAYER_GATE_BIN=$RUNNER_TEMP/apple-avplayer-check" \
            >> "$GITHUB_ENV"
          cd "$GITHUB_WORKSPACE"
          python3 -m unittest \
            scripts/test_reconcile_self_healing.py \
            scripts/test_sustained_stream_gate.py

      - name: Renew each official signed source independently
        id: refresh
        continue-on-error: true
        env:
          FORCE_REFRESH: ${{ inputs.force_refresh || 'false' }}
          BGUTIL_SERVER_HOME: ${{ runner.temp }}/bgutil-ytdlp-pot-provider/server
        run: python3 scripts/refresh_algerian_cloud.py

      - name: Publish successful renewals without blocking on another channel
        id: publish
        run: |
          if git diff --quiet -- \
            algerian-tv-july-2026.m3u \
            algerian-tv-july-2026-v2.m3u \
            streams/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            algerian-tv-july-2026.m3u \
            algerian-tv-july-2026-v2.m3u \
            streams/
          git commit -m "Renew Algerian self-healing sources ($(date -u +%FT%TZ))"
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Wait for public playlist publication
        if: steps.publish.outputs.changed == 'true'
        run: |
          for playlist in \
            algerian-tv-july-2026.m3u \
            algerian-tv-july-2026-v2.m3u; do
            local_hash="$(sha256sum "$playlist" | cut -d' ' -f1)"
            public_url="https://adamshl-oss.github.io/iptv-curated/$playlist"
            for attempt in $(seq 1 24); do
              remote_hash="$(
                curl -fsSL "${public_url}?sync=$(date -u +%s%N)" |
                  sha256sum |
                  cut -d' ' -f1
              )"
              [ "$remote_hash" = "$local_hash" ] && break
              [ "$attempt" -eq 24 ] && exit 1
              sleep 10
            done
          done

      - name: Audit, quarantine, recover, and rebuild
        id: reconcile
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/reconcile_self_healing.py \
            --country algeria \
            --apple-player \
            --apply \
            2>&1 | tee algerian-self-healing-audit.txt

      - name: Publish controller state and playlist changes
        id: reconcile-publish
        run: |
          if git diff --quiet -- \
            algerian-tv-july-2026.m3u \
            algerian-tv-july-2026-v2.m3u \
            iptv-coverage-status.json \
            scripts/algerian_top20_target.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            algerian-tv-july-2026.m3u \
            algerian-tv-july-2026-v2.m3u \
            iptv-coverage-status.json \
            scripts/algerian_top20_target.json
          git add -u
          git commit -m "Reconcile Algerian channel health ($(date -u +%FT%TZ))"
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Wait for reconciled public playlist publication
        if: steps.reconcile-publish.outputs.changed == 'true'
        run: |
          for playlist in \
            algerian-tv-july-2026.m3u \
            algerian-tv-july-2026-v2.m3u \
            iptv-coverage-status.json; do
            local_hash="$(sha256sum "$playlist" | cut -d' ' -f1)"
            public_url="https://adamshl-oss.github.io/iptv-curated/$playlist"
            for attempt in $(seq 1 24); do
              remote_hash="$(
                curl -fsSL "${public_url}?sync=$(date -u +%s%N)" |
                  sha256sum |
                  cut -d' ' -f1
              )"
              [ "$remote_hash" = "$local_hash" ] && break
              [ "$attempt" -eq 24 ] && exit 1
              sleep 10
            done
          done

      - name: Preserve audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: algerian-self-healing-${{ github.run_id }}
          path: algerian-self-healing-audit.txt
          retention-days: 30

      - name: Launch replacement discovery when coverage is degraded
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! grep -q $'^COVERAGE_DEGRADED\talgeria\t' \
            algerian-self-healing-audit.txt; then
            echo "Algerian target coverage is complete."
            exit 0
          fi

          active="$(
            gh api \
              "repos/$GH_REPO/actions/workflows/discover-channel-sources.yml/runs?branch=main&per_page=20" \
              --jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress")]
                | length'
          )"
          if [ "$active" -gt 0 ]; then
            echo "Replacement discovery is already active."
            exit 0
          fi

          latest_success="$(
            gh api \
              "repos/$GH_REPO/actions/workflows/discover-channel-sources.yml/runs?branch=main&status=success&per_page=1" \
              --jq '.workflow_runs[0].created_at // ""'
          )"
          if [ -n "$latest_success" ]; then
            age="$(( $(date -u +%s) - $(date -u -d "$latest_success" +%s) ))"
            if [ "$age" -le 1200 ]; then
              echo "Replacement discovery completed ${age}s ago; no duplicate launched."
              exit 0
            fi
          fi

          gh workflow run discover-channel-sources.yml \
            --repo "$GH_REPO" \
            --ref main
          echo "Replacement discovery launched immediately."

      - name: Report controller result
        if: always()
        env:
          RECONCILE_OUTCOME: ${{ steps.reconcile.outcome }}
        run: |
          coverage_line="$(grep $'^COVERAGE_.*\talgeria\t' algerian-self-healing-audit.txt | tail -1)"
          playback_line="$(grep $'^PLAYBACK_.*\talgeria\t' algerian-self-healing-audit.txt | tail -1)"
          outcome_line="$(grep $'^OUTCOME_.*\talgeria\t' algerian-self-healing-audit.txt | tail -1)"
          {
            echo "## Algerian playback and target coverage"
            echo
            echo '```'
            echo "$playback_line"
            echo "$outcome_line"
            echo "$coverage_line"
            echo '```'
            echo
            echo "A green run means the controller worked. Coverage and sustained quality are reported separately above."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$RECONCILE_OUTCOME" != "success" ]; then
            echo "The Algerian controller itself failed unexpectedly."
            exit 1
          fi
          if ! grep -Eq $'^PLAYBACK_(HEALTHY|SURVIVORS_HEALTHY)\talgeria\t' \
            algerian-self-healing-audit.txt; then
            echo "Published Algerian playback remains degraded."
            exit 1
          fi
          if grep -q $'^COVERAGE_COMPLETE\talgeria\t' algerian-self-healing-audit.txt; then
            echo "Algerian coverage is complete."
          else
            echo "::warning::$coverage_line"
            echo "Playback automation is operational; Algerian target coverage remains degraded."
          fi
