name: Refresh Algerian cloud channels

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      force_refresh:
        description: "Resolve new official URLs even when current ones are fresh"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: algerian-playlist-write
  cancel-in-progress: false

jobs:
  refresh-algerian-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node for YouTube challenges
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install stream tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg jq
          pip install -U "yt-dlp[default]" curl_cffi bgutil-ytdlp-pot-provider
          git clone --depth 1 --branch 1.3.1 \
            https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git \
            "$RUNNER_TEMP/bgutil-ytdlp-pot-provider"
          cd "$RUNNER_TEMP/bgutil-ytdlp-pot-provider/server"
          npm ci
          npx tsc

      - name: Refresh official dynamic feeds
        run: |
          for gate in 1 2; do
            if python3 scripts/refresh_algerian_cloud.py; then
              exit 0
            fi
            echo "Algerian resolver gate $gate failed; retrying the complete gate."
            sleep 10
          done
          exit 1
        env:
          FORCE_REFRESH: ${{ inputs.force_refresh || 'false' }}
          BGUTIL_SERVER_HOME: ${{ runner.temp }}/bgutil-ytdlp-pot-provider/server

      - name: Verify target identity, alias parity, and local playback
        id: local_check
        continue-on-error: true
        run: |
          chmod +x scripts/test_stream.sh scripts/check_algerian_playback.sh
          for gate in 1 2; do
            if python3 scripts/check_algerian_playback.py \
              algerian-tv-july-2026.m3u \
              algerian-tv-july-2026-v2.m3u; then
              exit 0
            fi
            echo "Algerian local playback gate $gate failed; retrying all three attempts."
            sleep 10
          done
          exit 1

      - name: Commit and push if changed
        if: steps.local_check.outcome == 'success'
        run: |
          if ! git diff --quiet -- algerian-tv-july-2026.m3u algerian-tv-july-2026-v2.m3u streams/; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add algerian-tv-july-2026.m3u algerian-tv-july-2026-v2.m3u streams/
            git commit -m "Refresh official Algerian cloud feeds ($(date -u +%FT%TZ))"
            git pull --rebase
            git push
          else
            echo "Dynamic Algerian cloud URLs are still fresh."
          fi

      - name: Wait for both public cloud copies
        if: steps.local_check.outcome == 'success'
        run: |
          for playlist in \
            algerian-tv-july-2026.m3u \
            algerian-tv-july-2026-v2.m3u; do
            local_hash="$(sha256sum "$playlist" | cut -d' ' -f1)"
            public_url="https://adamshl-oss.github.io/iptv-curated/$playlist"
            matched=false
            for attempt in $(seq 1 24); do
              remote_hash="$(
                curl -fsSL "${public_url}?sync=$(date -u +%s%N)" |
                  sha256sum |
                  cut -d' ' -f1
              )"
              if [ "$remote_hash" = "$local_hash" ]; then
                echo "Public $playlist is current."
                matched=true
                break
              fi
              sleep 10
            done
            if [ "$matched" != true ]; then
              echo "Public $playlist did not update within four minutes."
              exit 1
            fi
          done

      - name: Verify the public Apple TV playlist and alias
        id: public_check
        if: steps.local_check.outcome == 'success'
        continue-on-error: true
        run: |
          for gate in 1 2; do
            if python3 scripts/check_algerian_playback.py; then
              exit 0
            fi
            echo "Algerian public playback gate $gate failed; retrying all three attempts."
            sleep 10
          done
          exit 1

      - name: Stress-test Almagharibia sustained cloud path
        if: ${{ inputs.force_refresh == true && steps.public_check.outcome == 'success' }}
        continue-on-error: true
        run: |
          candidate="https://algerian-tv-relay-2026.espiiem.chatgpt.site/api/youtube/almagharibia"
          for gate in 1 2 3; do
            echo "Almagharibia outside-cloud stress gate $gate/3"
            for attempt in 1 2 3; do
              scripts/test_stream.sh \
                "${candidate}?cloud_probe=$(date -u +%s%N)-${gate}-${attempt}"
            done
          done
          echo "Almagharibia sustained 45-second cloud decode"
          timeout 90 ffmpeg -hide_banner -loglevel error \
            -rw_timeout 10000000 \
            -t 45 \
            -i "${candidate}?cloud_probe=$(date -u +%s%N)-sustained" \
            -map 0:v:0 -map 0:a:0 \
            -f null -
          echo "Almagharibia passed all three outside-cloud stress gates."

      - name: Probe unpublished El Watania recovery candidate
        if: ${{ inputs.force_refresh == true && steps.public_check.outcome == 'success' }}
        continue-on-error: true
        run: |
          candidate="https://livesstream.work.gd:5443/WebRTCApp/streams/stream.m3u8"
          echo "El Watania outside-cloud three-attempt recovery gate"
          for attempt in 1 2 3; do
            scripts/test_stream.sh \
              "${candidate}?cloud_probe=$(date -u +%s%N)-${attempt}"
          done
          echo "El Watania sustained 45-second outside-cloud decode"
          timeout 90 ffmpeg -hide_banner -loglevel error \
            -rw_timeout 10000000 \
            -t 45 \
            -i "${candidate}?cloud_probe=$(date -u +%s%N)-sustained" \
            -map 0:v:0 -map 0:a:0 \
            -f null -
          echo "El Watania passed its outside-cloud recovery gate."

      - name: Enforce complete published-playlist health
        if: always()
        env:
          LOCAL_OUTCOME: ${{ steps.local_check.outcome }}
          PUBLIC_OUTCOME: ${{ steps.public_check.outcome }}
        run: |
          if [ "$LOCAL_OUTCOME" != "success" ] ||
             [ "$PUBLIC_OUTCOME" != "success" ]; then
            echo "At least one Algerian channel failed the complete playback gate."
            exit 1
          fi
