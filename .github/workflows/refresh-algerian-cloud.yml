name: Refresh and audit self-healing Algerian channels

on:
  workflow_dispatch:
    inputs:
      force_refresh:
        description: "Force official signed-source renewal"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: algerian-self-healing-audit
  cancel-in-progress: false

jobs:
  refresh-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node for YouTube challenges
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install resolver and real playback tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg jq
          pip install -U "yt-dlp[default]" curl_cffi bgutil-ytdlp-pot-provider
          git clone --depth 1 --branch 1.3.1 \
            https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git \
            "$RUNNER_TEMP/bgutil-ytdlp-pot-provider"
          cd "$RUNNER_TEMP/bgutil-ytdlp-pot-provider/server"
          npm ci
          npx tsc
          chmod +x "$GITHUB_WORKSPACE/scripts/test_stream.sh"

      - name: Renew each official signed source independently
        id: refresh
        continue-on-error: true
        env:
          FORCE_REFRESH: ${{ inputs.force_refresh || 'false' }}
          BGUTIL_SERVER_HOME: ${{ runner.temp }}/bgutil-ytdlp-pot-provider/server
        run: python3 scripts/refresh_algerian_cloud.py

      - name: Publish successful renewals without blocking on another channel
        id: publish
        run: |
          if git diff --quiet -- \
            algerian-tv-july-2026.m3u \
            algerian-tv-july-2026-v2.m3u \
            streams/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            algerian-tv-july-2026.m3u \
            algerian-tv-july-2026-v2.m3u \
            streams/
          git commit -m "Renew Algerian self-healing sources ($(date -u +%FT%TZ))"
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Wait for public playlist publication
        if: steps.publish.outputs.changed == 'true'
        run: |
          for playlist in \
            algerian-tv-july-2026.m3u \
            algerian-tv-july-2026-v2.m3u; do
            local_hash="$(sha256sum "$playlist" | cut -d' ' -f1)"
            public_url="https://adamshl-oss.github.io/iptv-curated/$playlist"
            for attempt in $(seq 1 24); do
              remote_hash="$(
                curl -fsSL "${public_url}?sync=$(date -u +%s%N)" |
                  sha256sum |
                  cut -d' ' -f1
              )"
              [ "$remote_hash" = "$local_hash" ] && break
              [ "$attempt" -eq 24 ] && exit 1
              sleep 10
            done
          done

      - name: Audit, quarantine, recover, and rebuild
        id: reconcile
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/reconcile_self_healing.py \
            --country algeria \
            --apply \
            2>&1 | tee algerian-self-healing-audit.txt

      - name: Publish controller state and playlist changes
        id: reconcile-publish
        run: |
          if git diff --quiet -- \
            algerian-tv-july-2026.m3u \
            algerian-tv-july-2026-v2.m3u \
            iptv-coverage-status.json \
            scripts/algerian_top20_target.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            algerian-tv-july-2026.m3u \
            algerian-tv-july-2026-v2.m3u \
            iptv-coverage-status.json \
            scripts/algerian_top20_target.json
          git commit -m "Reconcile Algerian channel health ($(date -u +%FT%TZ))"
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Wait for reconciled public playlist publication
        if: steps.reconcile-publish.outputs.changed == 'true'
        run: |
          for playlist in \
            algerian-tv-july-2026.m3u \
            algerian-tv-july-2026-v2.m3u \
            iptv-coverage-status.json; do
            local_hash="$(sha256sum "$playlist" | cut -d' ' -f1)"
            public_url="https://adamshl-oss.github.io/iptv-curated/$playlist"
            for attempt in $(seq 1 24); do
              remote_hash="$(
                curl -fsSL "${public_url}?sync=$(date -u +%s%N)" |
                  sha256sum |
                  cut -d' ' -f1
              )"
              [ "$remote_hash" = "$local_hash" ] && break
              [ "$attempt" -eq 24 ] && exit 1
              sleep 10
            done
          done

      - name: Preserve audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: algerian-self-healing-${{ github.run_id }}
          path: algerian-self-healing-audit.txt
          retention-days: 30

      - name: Report controller result
        if: always()
        env:
          RECONCILE_OUTCOME: ${{ steps.reconcile.outcome }}
        run: |
          coverage_line="$(grep $'^COVERAGE_.*\talgeria\t' algerian-self-healing-audit.txt | tail -1)"
          {
            echo "## Algerian target coverage"
            echo
            echo '```'
            echo "$coverage_line"
            echo '```'
            echo
            echo "A healthy controller run does not make incomplete coverage complete."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$RECONCILE_OUTCOME" != "success" ]; then
            if grep -q $'^OPERATIONAL\talgeria controller' algerian-self-healing-audit.txt; then
              echo "::warning::An Algerian channel failed its first complete gate; the next run will retry or quarantine it."
              exit 0
            fi
            echo "The Algerian controller itself failed unexpectedly."
            exit 1
          fi
          if grep -q $'^COVERAGE_COMPLETE\talgeria\t' algerian-self-healing-audit.txt; then
            echo "Algerian coverage is complete."
          else
            echo "::warning::$coverage_line"
            echo "Playback automation is operational; Algerian target coverage remains degraded."
          fi
