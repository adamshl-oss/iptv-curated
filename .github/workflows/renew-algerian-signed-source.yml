name: Renew Algerian signed recovery source

on:
  schedule:
    - cron: "49 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: algerian-signed-source-renewal
  cancel-in-progress: true

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node for YouTube challenges
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install official-source resolvers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg jq
          python3 -m pip install --upgrade \
            curl_cffi "yt-dlp[default]" bgutil-ytdlp-pot-provider
          git clone --depth 1 --branch 1.3.1 \
            https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git \
            "$RUNNER_TEMP/bgutil-ytdlp-pot-provider"
          cd "$RUNNER_TEMP/bgutil-ytdlp-pot-provider/server"
          npm ci
          npx tsc

      - name: Resolve current official live source
        env:
          FORCE_REFRESH: "true"
          BGUTIL_SERVER_HOME: ${{ runner.temp }}/bgutil-ytdlp-pot-provider/server
        run: python3 scripts/refresh_algerian_cloud.py

      - name: Require a durable public cloud recovery path
        run: |
          chmod +x scripts/test_stream.sh
          public_relay="https://algerian-tv-relay-2026.espiiem.chatgpt.site/api/youtube/almagharibia"
          passed=0
          for attempt in 1 2 3 4 5; do
            echo "Public relay playback gate $attempt/5"
            if scripts/test_stream.sh "$public_relay"; then
              passed="$((passed + 1))"
            fi
            sleep 5
          done
          echo "Public relay passed $passed/5 complete playback gates."
          [ "$passed" -ge 3 ]

      - name: Publish renewal
        run: |
          if git diff --quiet -- \
            algerian-tv-july-2026.m3u \
            algerian-tv-july-2026-v2.m3u \
            streams/almagharibia.m3u8; then
            echo "Existing official recovery source is still durable."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            algerian-tv-july-2026.m3u \
            algerian-tv-july-2026-v2.m3u \
            streams/almagharibia.m3u8
          git commit -m "Renew official Almagharibia recovery source"
          git pull --rebase
          git push
