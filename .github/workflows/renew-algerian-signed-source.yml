name: Renew Algerian signed recovery source

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iptv-state-writer
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node for YouTube challenges
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install official-source resolvers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg jq
          python3 -m pip install --upgrade \
            curl_cffi "yt-dlp[default]" bgutil-ytdlp-pot-provider
          git clone --depth 1 --branch 1.3.1 \
            https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git \
            "$RUNNER_TEMP/bgutil-ytdlp-pot-provider"
          cd "$RUNNER_TEMP/bgutil-ytdlp-pot-provider/server"
          npm ci
          npx tsc

      - name: Resolve current official live source
        env:
          FORCE_REFRESH: "true"
          BGUTIL_SERVER_HOME: ${{ runner.temp }}/bgutil-ytdlp-pot-provider/server
        run: python3 scripts/refresh_algerian_cloud.py

      - name: Synchronize and verify all three playlists
        run: |
          python3 -m unittest scripts/test_build_combined_playlist.py
          python3 scripts/build_combined_playlist.py
          cmp french-tv-top20-july-2026.m3u french-tv-july-2026-v5.m3u
          cmp algerian-tv-july-2026.m3u algerian-tv-july-2026-v2.m3u
          python3 scripts/build_combined_playlist.py --check

      - name: Require a fresh playable Echorouk recovery path
        run: |
          chmod +x scripts/test_stream.sh
          python3 - <<'PY'
          from urllib.parse import urlparse
          from scripts.refresh_algerian_cloud import current_wrapper_url
          url = current_wrapper_url("echorouk") or ""
          parsed = urlparse(url)
          if not (
              parsed.scheme == "https"
              and (parsed.hostname or "").endswith(".dzsecurity.net")
              and parsed.query.startswith("session=")
          ):
              raise SystemExit("Echorouk wrapper has no fresh HTTPS edge session")
          PY
          passed=0
          for attempt in 1 2 3; do
            echo "Echorouk wrapper playback gate $attempt/3"
            if scripts/test_stream.sh streams/echorouk.m3u8; then
              passed="$((passed + 1))"
            fi
            sleep 5
          done
          echo "Echorouk wrapper passed $passed/3 complete playback gates."
          [ "$passed" -ge 3 ]

      - name: Publish renewal
        run: |
          if git diff --quiet -- \
            algerian-tv-july-2026.m3u \
            algerian-tv-july-2026-v2.m3u \
            chaines-tv-candidate.m3u \
            streams/almagharibia.m3u8 \
            streams/echorouk.m3u8; then
            echo "Existing official recovery source is still durable."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            algerian-tv-july-2026.m3u \
            algerian-tv-july-2026-v2.m3u \
            chaines-tv-candidate.m3u \
            streams/almagharibia.m3u8 \
            streams/echorouk.m3u8
          git commit -m "Renew official Algerian signed sources"
          git pull --rebase
          git push

      - name: Verify public synchronized playlists
        run: |
          for playlist in \
            french-tv-top20-july-2026.m3u \
            algerian-tv-july-2026.m3u \
            chaines-tv-candidate.m3u; do
            local_hash="$(sha256sum "$playlist" | cut -d' ' -f1)"
            public_url="https://adamshl-oss.github.io/iptv-curated/$playlist"
            for attempt in $(seq 1 24); do
              remote_hash="$(
                curl -fsSL "${public_url}?sync=$(date -u +%s%N)" |
                  sha256sum |
                  cut -d' ' -f1
              )"
              [ "$remote_hash" = "$local_hash" ] && break
              [ "$attempt" -eq 24 ] && exit 1
              sleep 10
            done
          done
