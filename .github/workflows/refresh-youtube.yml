name: Refresh YouTube lives

on:
  schedule:
    - cron: "0 */2 * * *"   # every 2 hours (tokens last 2-6h)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: playlist-write
  cancel-in-progress: false

jobs:
  refresh-yt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Set up Node for YouTube challenges
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install ffmpeg + current YouTube challenge support
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg jq
          pip install -U "yt-dlp[default]" bgutil-ytdlp-pot-provider
          git clone --depth 1 --branch 1.3.1 \
            https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git \
            "$RUNNER_TEMP/bgutil-ytdlp-pot-provider"
          cd "$RUNNER_TEMP/bgutil-ytdlp-pot-provider/server"
          npm ci
          npx tsc

      - run: chmod +x scripts/test_stream.sh scripts/refresh_youtube.py

      - name: Refresh YouTube live URLs
        env:
          BGUTIL_SERVER_HOME: ${{ runner.temp }}/bgutil-ytdlp-pot-provider/server
        run: python3 scripts/refresh_youtube.py

      - name: Commit & push if changed
        run: |
          if ! git diff --quiet -- "claudette-*.m3u"; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add claudette-usa.m3u claudette-france.m3u claudette-algeria.m3u claudette-us-news.m3u
            git commit -m "Auto-refresh YouTube lives ($(date -u +%FT%TZ))"
            git push
          else
            echo "No changes; YouTube URLs already fresh."
          fi
