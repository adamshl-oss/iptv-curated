name: Discover and qualify channel replacements

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: iptv-state-writer
  cancel-in-progress: false

jobs:
  discover:
    runs-on: macos-14
    timeout-minutes: 55
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Restore durable research memory
        run: |
          mkdir -p .automation
          if git fetch origin \
            refs/heads/discovery-state:refs/remotes/origin/discovery-state; then
            git show \
              origin/discovery-state:source-discovery-history.json \
              > .automation/source-discovery-history.json
          fi

      - name: Verify discovery policy
        run: |
          python3 -m unittest \
            scripts/test_build_combined_playlist.py \
            scripts/test_discover_channel_sources.py \
            scripts/test_discovery_memory.py \
            scripts/test_coverage_status.py \
            scripts/test_reconcile_self_healing.py \
            scripts/test_sustained_stream_gate.py
          jq empty \
            scripts/source_discovery.json \
            scripts/stream_health_policy.json \
            scripts/self_healing_catalog.json \
            scripts/french_top20_target.json \
            scripts/algerian_top20_target.json \
            iptv-coverage-status.json
          if [ -f .automation/source-discovery-history.json ]; then
            jq empty .automation/source-discovery-history.json
          fi

      - name: Plan a fresh research frontier
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/discover_channel_sources.py \
            --country all \
            --history .automation/source-discovery-history.json \
            --plan-only \
            --report source-discovery-plan.json | tee source-discovery-plan.txt
          if grep -q '^SEARCH_DUE' source-discovery-plan.txt; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "due=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install playback tools
        if: steps.plan.outputs.due == 'true'
        run: |
          brew install ffmpeg jq coreutils
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          chmod +x scripts/test_stream.sh
          chmod +x scripts/sustained_stream_gate.py
          xcrun swiftc -O scripts/apple_avplayer_check.swift \
            -o "$RUNNER_TEMP/apple-avplayer-check"
          echo "APPLE_AVPLAYER_GATE_BIN=$RUNNER_TEMP/apple-avplayer-check" \
            >> "$GITHUB_ENV"

      - name: Search and qualify exact replacements
        id: search
        if: steps.plan.outputs.due == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/discover_channel_sources.py \
            --country all \
            --apply \
            --history .automation/source-discovery-history.json \
            --report source-discovery-report.json
          if jq -e '.changed_countries | length > 0' \
            source-discovery-report.json >/dev/null; then
            echo "qualified=true" >> "$GITHUB_OUTPUT"
          else
            echo "qualified=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Independent recovery gate and playlist rebuild
        if: >-
          steps.plan.outputs.due == 'true' &&
          steps.search.outputs.qualified == 'true'
        run: |
          set -o pipefail
          for country in france algeria; do
            python3 scripts/reconcile_self_healing.py \
              --country "$country" \
              --apple-player \
              --apply \
              2>&1 | tee "$country-discovery-recovery.txt" || {
                grep -q $'^OPERATIONAL\t'"$country"' controller' \
                  "$country-discovery-recovery.txt"
              }
          done
          python3 scripts/build_combined_playlist.py
          cmp french-tv-top20-july-2026.m3u french-tv-july-2026-v5.m3u
          cmp algerian-tv-july-2026.m3u algerian-tv-july-2026-v2.m3u
          python3 scripts/build_combined_playlist.py --check

      - name: Publish qualified recoveries
        id: publish
        if: >-
          steps.plan.outputs.due == 'true' &&
          steps.search.outputs.qualified == 'true'
        run: |
          paths=(
            french-tv-top20-july-2026.m3u
            french-tv-july-2026-v5.m3u
            algerian-tv-july-2026.m3u
            algerian-tv-july-2026-v2.m3u
            chaines-tv.m3u
            iptv-coverage-status.json
            scripts/french_top20_target.json
            scripts/algerian_top20_target.json
          )
          if git diff --quiet -- "${paths[@]}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${paths[@]}"
          git commit -m "Discover and qualify channel replacements ($(date -u +%FT%TZ))"
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Persist durable research memory
        if: always() && steps.plan.outputs.due == 'true'
        run: |
          history=.automation/source-discovery-history.json
          [ -s "$history" ] || exit 0
          state_parent="$(mktemp -d)"
          state_dir="$state_parent/state"
          state_branch="discovery-state-${GITHUB_RUN_ID}"
          if git ls-remote --exit-code --heads origin discovery-state >/dev/null; then
            git fetch origin \
              refs/heads/discovery-state:refs/remotes/origin/discovery-state
            git worktree add -b "$state_branch" \
              "$state_dir" origin/discovery-state
          else
            git worktree add --detach "$state_dir" HEAD
            git -C "$state_dir" switch --orphan "$state_branch"
            git -C "$state_dir" rm -rf . || true
          fi
          cp "$history" "$state_dir/source-discovery-history.json"
          git -C "$state_dir" config user.name "github-actions[bot]"
          git -C "$state_dir" config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$state_dir" add source-discovery-history.json
          if ! git -C "$state_dir" diff --cached --quiet; then
            git -C "$state_dir" commit -m \
              "Record channel research frontier (${GITHUB_RUN_ID})"
            git -C "$state_dir" push origin HEAD:discovery-state
          fi
          git worktree remove "$state_dir"
          git branch -D "$state_branch" || true
          rmdir "$state_parent"

      - name: Wait for GitHub Pages publication
        if: steps.publish.outputs.changed == 'true'
        run: |
          for playlist in \
            french-tv-top20-july-2026.m3u \
            french-tv-july-2026-v5.m3u \
            algerian-tv-july-2026.m3u \
            algerian-tv-july-2026-v2.m3u \
            chaines-tv.m3u \
            iptv-coverage-status.json; do
            local_hash="$(sha256sum "$playlist" | cut -d' ' -f1)"
            public_url="https://adamshl-oss.github.io/iptv-curated/$playlist"
            for attempt in $(seq 1 60); do
              remote_hash="$(
                curl -fsSL "${public_url}?sync=$(date -u +%s%N)" |
                  sha256sum |
                  cut -d' ' -f1
              )"
              [ "$remote_hash" = "$local_hash" ] && break
              [ "$attempt" -eq 60 ] && exit 1
              sleep 10
            done
          done

      - name: Validate published recoveries
        if: steps.publish.outputs.changed == 'true'
        run: |
          python3 scripts/check_french_top20_playback.py &
          french_pid=$!
          python3 scripts/check_algerian_playback.py &
          algerian_pid=$!
          wait "$french_pid"
          wait "$algerian_pid"

      - name: Report persistent target coverage
        if: always()
        run: |
          python3 scripts/coverage_status.py --check | tee coverage-summary.txt
          if [ -s source-discovery-report.json ]; then
            qualified="$(jq -r '.qualified_count // 0' source-discovery-report.json)"
            searched="$(jq -r '.targets_searched // 0' source-discovery-report.json)"
          else
            qualified=0
            searched=0
          fi
          {
            echo "## Discovery result and IPTV target coverage"
            echo
            echo '```'
            echo "NET_NEW_QUALIFIED_CHANNELS=$qualified"
            echo "FRESH_RESEARCH_TASKS=$searched"
            cat coverage-summary.txt
            echo '```'
            echo
            echo "A completed search with zero qualified channels is recorded as no progress, not goal success."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$qualified" -eq 0 ]; then
            echo "::warning::No new channel qualified in this discovery run."
          fi
          while IFS= read -r line; do
            case "$line" in
              COVERAGE_DEGRADED*) echo "::warning::$line" ;;
            esac
          done < coverage-summary.txt

      - name: Preserve discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: channel-source-discovery-${{ github.run_id }}
          path: |
            source-discovery-plan.json
            source-discovery-plan.txt
            source-discovery-report.json
            .automation/source-discovery-history.json
            france-discovery-recovery.txt
            algeria-discovery-recovery.txt
            coverage-summary.txt
            iptv-coverage-status.json
          if-no-files-found: warn
          retention-days: 30
