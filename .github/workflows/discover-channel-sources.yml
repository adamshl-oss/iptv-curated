name: Discover and qualify channel replacements

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: channel-source-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install playback tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg jq
          chmod +x scripts/test_stream.sh

      - name: Verify discovery policy
        run: |
          python3 -m unittest scripts/test_discover_channel_sources.py
          jq empty \
            scripts/source_discovery.json \
            scripts/self_healing_catalog.json \
            scripts/french_top20_target.json \
            scripts/algerian_top20_target.json

      - name: Search and qualify exact replacements
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/discover_channel_sources.py \
            --country all \
            --apply \
            --report source-discovery-report.json

      - name: Independent recovery gate and playlist rebuild
        run: |
          set -o pipefail
          for country in france algeria; do
            python3 scripts/reconcile_self_healing.py \
              --country "$country" \
              --apply \
              2>&1 | tee "$country-discovery-recovery.txt" || {
                grep -q $'^PASS\t'"$country"' controller' \
                  "$country-discovery-recovery.txt"
              }
          done
          cmp french-tv-top20-july-2026.m3u french-tv-july-2026-v5.m3u
          cmp algerian-tv-july-2026.m3u algerian-tv-july-2026-v2.m3u

      - name: Publish qualified recoveries
        id: publish
        run: |
          paths=(
            french-tv-top20-july-2026.m3u
            french-tv-july-2026-v5.m3u
            algerian-tv-july-2026.m3u
            algerian-tv-july-2026-v2.m3u
            scripts/french_top20_target.json
            scripts/algerian_top20_target.json
          )
          if git diff --quiet -- "${paths[@]}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${paths[@]}"
          git commit -m "Discover and qualify channel replacements ($(date -u +%FT%TZ))"
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Wait for GitHub Pages publication
        if: steps.publish.outputs.changed == 'true'
        run: |
          for playlist in \
            french-tv-top20-july-2026.m3u \
            french-tv-july-2026-v5.m3u \
            algerian-tv-july-2026.m3u \
            algerian-tv-july-2026-v2.m3u; do
            local_hash="$(sha256sum "$playlist" | cut -d' ' -f1)"
            public_url="https://adamshl-oss.github.io/iptv-curated/$playlist"
            for attempt in $(seq 1 60); do
              remote_hash="$(
                curl -fsSL "${public_url}?sync=$(date -u +%s%N)" |
                  sha256sum |
                  cut -d' ' -f1
              )"
              [ "$remote_hash" = "$local_hash" ] && break
              [ "$attempt" -eq 60 ] && exit 1
              sleep 10
            done
          done

      - name: Validate published recoveries
        if: steps.publish.outputs.changed == 'true'
        run: |
          python3 scripts/check_french_top20_playback.py &
          french_pid=$!
          python3 scripts/check_algerian_playback.py &
          algerian_pid=$!
          wait "$french_pid"
          wait "$algerian_pid"

      - name: Preserve discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: channel-source-discovery-${{ github.run_id }}
          path: |
            source-discovery-report.json
            france-discovery-recovery.txt
            algeria-discovery-recovery.txt
          if-no-files-found: warn
          retention-days: 30
