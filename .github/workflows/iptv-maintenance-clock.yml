name: IPTV maintenance cloud clock

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  deployments: write

concurrency:
  group: iptv-maintenance-cloud-clock
  cancel-in-progress: false

jobs:
  wait-and-pulse:
    # The GitHub environment supplies a server-side 15-minute wait timer. It
    # does not need this Mac and does not occupy a runner during the delay.
    environment: iptv-maintenance-clock
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Queue the next clock pulse before doing any maintenance
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if gh workflow run iptv-maintenance-clock.yml \
              --repo "$GH_REPO" \
              --ref main; then
              echo "Successor pulse queued."
              exit 0
            fi
            echo "Successor dispatch attempt $attempt failed; retrying."
            sleep 10
          done
          echo "::error::Could not queue the successor clock pulse."
          exit 1

      - name: Pulse the serial maintenance watchdog
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if gh workflow run scheduler-watchdog.yml \
              --repo "$GH_REPO" \
              --ref main; then
              echo "Maintenance watchdog queued."
              exit 0
            fi
            echo "Watchdog dispatch attempt $attempt failed; retrying."
            sleep 10
          done
          echo "::error::Could not pulse the maintenance watchdog."
          exit 1
