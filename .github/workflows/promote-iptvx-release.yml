name: Promote verified IPTVX release

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      release:
        description: "Release ID: YYYY-MM-DD or YYYY-MM-DD-suffix"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: iptvx-release-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: macos-14
    timeout-minutes: 55
    steps:
      - name: Validate requested release ID before the expensive playback audit
        if: ${{ inputs.release != '' }}
        env:
          REQUESTED_RELEASE: ${{ inputs.release }}
        run: |
          [[ "$REQUESTED_RELEASE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}(-[a-z0-9]+)*$ ]] || {
            echo "Invalid release ID: use YYYY-MM-DD or YYYY-MM-DD-suffix"
            exit 1
          }
      - uses: actions/checkout@v4
      - name: Install actual media and Apple playback tools
        run: |
          brew install ffmpeg jq coreutils
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          xcrun swiftc -O scripts/apple_avplayer_check.swift -o "$RUNNER_TEMP/apple-player"
          echo "APPLE_AVPLAYER_GATE_BIN=$RUNNER_TEMP/apple-player" >> "$GITHUB_ENV"
          python3 -m unittest scripts/test_promote_client_playlist.py
          python3 -m unittest scripts/test_audit_client_playlist.py
      - name: Test every candidate and prior client URL
        run: |
          python3 -u scripts/audit_client_playlist.py chaines-tv-candidate.m3u \
            --include-playlist chaines-tv.m3u --apple-player \
            --report "$RUNNER_TEMP/client-audit.json" || test -f "$RUNNER_TEMP/client-audit.json"
      - name: Refresh Git state and detect a newer candidate
        id: freshness
        run: |
          git pull --ff-only
          # A recovery or a metadata-only organization change can land while
          # this 20+ minute all-channel gate runs.  Its audit evidence must
          # never be applied to a different candidate, but that safe refusal
          # is normal handoff—not a failed release or an alert condition.
          if cmp -s "$RUNNER_TEMP/client-audit.m3u" chaines-tv-candidate.m3u; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "STALE_CANDIDATE: a newer candidate will be audited by the next release run"
          fi
      - name: Validate and promote the candidate
        if: steps.freshness.outputs.fresh == 'true'
        env:
          REQUESTED_RELEASE: ${{ inputs.release }}
        run: |
          release="${REQUESTED_RELEASE:-$(date -u +%F)-${GITHUB_RUN_ID}}"
          python3 scripts/promote_client_playlist.py --release "$release" \
            --report "$RUNNER_TEMP/client-audit.json"
          python3 -m py_compile scripts/promote_client_playlist.py
          git diff --check
      - name: Commit the immutable release and fixed aliases
        if: steps.freshness.outputs.fresh == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iptvx.m3u chaines-tv.m3u releases/
          git diff --cached --quiet && exit 0
          git commit -m "Promote playback-tested IPTVX release ${GITHUB_RUN_ID}"
          git pull --rebase
          git push
      - name: Verify both actual public client aliases
        if: steps.freshness.outputs.fresh == 'true'
        run: |
          for playlist in chaines-tv.m3u iptvx.m3u; do
            expected="$(shasum -a 256 "$playlist" | cut -d' ' -f1)"
            matched=false
            for attempt in $(seq 1 24); do
              actual="$(curl -fsSL "https://adamshl-oss.github.io/iptv-curated/${playlist}?audit=${GITHUB_RUN_ID}-${attempt}" | shasum -a 256 | cut -d' ' -f1)"
              if [ "$actual" = "$expected" ]; then matched=true; break; fi
              sleep 10
            done
            [ "$matched" = true ] || exit 1
          done
      - name: Preserve every-channel evidence even when promotion is blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-playback-${{ github.run_id }}
          path: ${{ runner.temp }}/client-audit.*
          retention-days: 30
