name: Recover missed IPTV maintenance runs

on:
  schedule:
    # Independent catch-up cadence. GitHub may drop an individual schedule;
    # this controller dispatches any maintenance workflow that became stale.
    - cron: "5,20,35,50 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows:
      - Audit self-healing French channels
      - Refresh and audit self-healing Algerian channels
      - Refresh YouTube lives
      - Refresh playlists
      - Discover and qualify channel replacements
      - Renew Algerian signed recovery source
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: iptv-scheduler-watchdog
  cancel-in-progress: false

jobs:
  recover-stale-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Dispatch stale maintenance workflows
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          now="$(date -u +%s)"

          failed=0

          dispatch_if_stale() {
            workflow="$1"
            max_age="$2"
            latest="$({
              gh api \
                -H "Accept: application/vnd.github+json" \
                "repos/$GH_REPO/actions/workflows/$workflow/runs?branch=main&per_page=1" \
                --jq '.workflow_runs[0].created_at // ""'
            } 2>/dev/null || true)"

            if [ -n "$latest" ]; then
              latest_epoch="$(date -u -d "$latest" +%s)"
              age="$((now - latest_epoch))"
            else
              age="$((max_age + 1))"
            fi

            if [ "$age" -le "$max_age" ]; then
              echo "$workflow is fresh (${age}s old)."
              return 0
            fi

            echo "$workflow is stale (${age}s old); dispatching serial catch-up."
            before="$(
              gh api \
                "repos/$GH_REPO/actions/workflows/$workflow/runs?event=workflow_dispatch&branch=main&per_page=1" \
                --jq '.workflow_runs[0].id // 0'
            )"
            gh workflow run "$workflow" --repo "$GH_REPO" --ref main

            run_id=""
            for attempt in $(seq 1 30); do
              latest_id="$(
                gh api \
                  "repos/$GH_REPO/actions/workflows/$workflow/runs?event=workflow_dispatch&branch=main&per_page=1" \
                  --jq '.workflow_runs[0].id // 0'
              )"
              if [ "$latest_id" != "$before" ] && [ "$latest_id" != "0" ]; then
                run_id="$latest_id"
                break
              fi
              sleep 2
            done

            if [ -z "$run_id" ]; then
              echo "::error::$workflow dispatch was not accepted within 60 seconds."
              failed="$((failed + 1))"
              return 0
            fi

            echo "Waiting for $workflow catch-up run $run_id."
            if ! gh run watch "$run_id" --repo "$GH_REPO" --exit-status --interval 5; then
              echo "::error::$workflow catch-up run $run_id failed."
              failed="$((failed + 1))"
            fi
          }

          dispatch_if_stale refresh-french-cloud.yml 1500
          dispatch_if_stale refresh-algerian-cloud.yml 1500
          dispatch_if_stale refresh-youtube.yml 6300
          dispatch_if_stale refresh.yml 19800
          dispatch_if_stale discover-channel-sources.yml 19800
          dispatch_if_stale renew-algerian-signed-source.yml 6300

          if [ "$failed" -ne 0 ]; then
            echo "::error::$failed catch-up workflow(s) failed."
            exit 1
          fi
