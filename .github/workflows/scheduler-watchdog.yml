name: Recover missed IPTV maintenance runs

on:
  schedule:
    # Independent catch-up cadence. GitHub may drop an individual schedule;
    # this controller dispatches any maintenance workflow that became stale.
    - cron: "5,20,35,50 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows:
      - Audit self-healing French channels
      - Refresh and audit self-healing Algerian channels
      - Refresh YouTube lives
      - Refresh playlists
      - Discover and qualify channel replacements
      - Renew Algerian signed recovery source
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: iptv-scheduler-watchdog
  cancel-in-progress: false

jobs:
  recover-stale-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Dispatch stale maintenance workflows
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          now="$(date -u +%s)"

          failed=0

          ensure_cloud_clock() {
            active="$({
              gh api \
                "repos/$GH_REPO/actions/workflows/iptv-maintenance-clock.yml/runs?branch=main&per_page=10" \
                --jq '[.workflow_runs[] | select(.status == "waiting" or .status == "queued" or .status == "in_progress")][0] | if . then [.id, .status, .created_at] | @tsv else "" end'
            } 2>/dev/null || true)"

            if [ -n "$active" ]; then
              IFS=$'\t' read -r clock_id clock_status clock_created <<< "$active"
              clock_epoch="$(date -u -d "$clock_created" +%s)"
              clock_age="$((now - clock_epoch))"
              if [ "$clock_age" -le 2700 ]; then
                echo "Cloud clock run $clock_id is $clock_status (${clock_age}s old)."
                return 0
              fi
              echo "Cloud clock run $clock_id is stale (${clock_age}s old); starting a replacement."
            else
              echo "No active cloud clock exists; starting a replacement."
            fi

            if ! gh workflow run iptv-maintenance-clock.yml --repo "$GH_REPO" --ref main; then
              echo "::error::Could not restore the server-side maintenance clock."
              failed="$((failed + 1))"
            fi
          }

          dispatch_if_stale() {
            workflow="$1"
            max_age="$2"
            latest="$({
              gh api \
                -H "Accept: application/vnd.github+json" \
                "repos/$GH_REPO/actions/workflows/$workflow/runs?branch=main&per_page=1" \
                --jq '(.workflow_runs[0] // empty) | [.id, .status, (.conclusion // ""), .created_at] | @tsv'
            } 2>/dev/null || true)"

            if [ -n "$latest" ]; then
              IFS=$'\t' read -r latest_id latest_status latest_conclusion latest_created <<< "$latest"
              latest_epoch="$(date -u -d "$latest_created" +%s)"
              latest_age="$((now - latest_epoch))"

              # A new queued run gets a short acquisition grace period. A real
              # running job gets the full Actions job timeout. Neither state is
              # allowed to mask recovery forever.
              if [ "$latest_status" = "queued" ] && [ "$latest_age" -le 600 ]; then
                echo "$workflow has queued run $latest_id (${latest_age}s old)."
                return 0
              fi
              if [ "$latest_status" = "in_progress" ] && [ "$latest_age" -le 3600 ]; then
                echo "$workflow has active run $latest_id (${latest_age}s old)."
                return 0
              fi
            fi

            # Only a successful completion can make maintenance fresh. Failed,
            # cancelled, timed-out, or abandoned queued runs never reset this
            # clock.
            latest_success="$({
              gh api \
                -H "Accept: application/vnd.github+json" \
                "repos/$GH_REPO/actions/workflows/$workflow/runs?branch=main&status=success&per_page=1" \
                --jq '.workflow_runs[0].created_at // ""'
            } 2>/dev/null || true)"
            if [ -n "$latest_success" ]; then
              success_epoch="$(date -u -d "$latest_success" +%s)"
              age="$((now - success_epoch))"
            else
              age="$((max_age + 1))"
            fi

            if [ "$age" -le "$max_age" ]; then
              echo "$workflow is fresh from a successful run (${age}s old)."
              return 0
            fi

            echo "$workflow is stale (${age}s old); dispatching serial catch-up."
            before="$(
              gh api \
                "repos/$GH_REPO/actions/workflows/$workflow/runs?event=workflow_dispatch&branch=main&per_page=1" \
                --jq '.workflow_runs[0].id // 0'
            )"
            gh workflow run "$workflow" --repo "$GH_REPO" --ref main

            run_id=""
            for attempt in $(seq 1 30); do
              latest_id="$(
                gh api \
                  "repos/$GH_REPO/actions/workflows/$workflow/runs?event=workflow_dispatch&branch=main&per_page=1" \
                  --jq '.workflow_runs[0].id // 0'
              )"
              if [ "$latest_id" != "$before" ] && [ "$latest_id" != "0" ]; then
                run_id="$latest_id"
                break
              fi
              sleep 2
            done

            if [ -z "$run_id" ]; then
              echo "::error::$workflow dispatch was not accepted within 60 seconds."
              failed="$((failed + 1))"
              return 0
            fi

            echo "Waiting for $workflow catch-up run $run_id."
            if ! gh run watch "$run_id" --repo "$GH_REPO" --exit-status --interval 5; then
              echo "::error::$workflow catch-up run $run_id failed."
              failed="$((failed + 1))"
            fi
          }

          # Native cron and workflow-run events are a second way back into this
          # controller. If the self-renewing server-side clock ever loses its
          # successor, the next watchdog invocation recreates it.
          ensure_cloud_clock

          coverage_document="$({
            gh api \
              -H "Accept: application/vnd.github.raw+json" \
              "repos/$GH_REPO/contents/iptv-coverage-status.json?ref=main"
          } 2>/dev/null || true)"
          if jq -e '
            .countries.france.state == "complete" and
            .countries.algeria.state == "complete"
          ' >/dev/null 2>&1 <<< "$coverage_document"; then
            discovery_max_age=19800
            echo "Target coverage is complete; discovery remains on the improvement cadence."
          else
            discovery_max_age=1500
            france_coverage="$(
              jq -r '
                .countries.france |
                "\(.published_count)/\(.required_count)"
              ' <<< "$coverage_document" 2>/dev/null || echo unknown
            )"
            algeria_coverage="$(
              jq -r '
                .countries.algeria |
                "\(.published_count)/\(.required_count)"
              ' <<< "$coverage_document" 2>/dev/null || echo unknown
            )"
            echo "Target coverage is degraded (France $france_coverage; Algeria $algeria_coverage); discovery must run at least every 25 minutes."
          fi

          dispatch_if_stale refresh-french-cloud.yml 1500
          dispatch_if_stale refresh-algerian-cloud.yml 1500
          dispatch_if_stale refresh-youtube.yml 6300
          dispatch_if_stale refresh.yml 19800
          dispatch_if_stale discover-channel-sources.yml "$discovery_max_age"
          dispatch_if_stale renew-algerian-signed-source.yml 6300

          if [ "$failed" -ne 0 ]; then
            echo "::error::$failed catch-up workflow(s) failed."
            exit 1
          fi
