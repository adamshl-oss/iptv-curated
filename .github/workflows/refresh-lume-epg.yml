name: Refresh Lume programme guide

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lume-epg-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify the Lume guide
        run: |
          if ! python3 scripts/build_lume_epg.py; then
            echo "::warning::Guide provider unavailable; retaining last-known-good Lume EPG."
            exit 0
          fi
          gzip -t lume-epg.xml.gz
      - name: Publish only a valid changed guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lume-epg.xml.gz
          git diff --cached --quiet && exit 0
          git commit -m "Refresh Lume programme guide ($(date -u +%FT%TZ))"
          git pull --rebase
          git push
