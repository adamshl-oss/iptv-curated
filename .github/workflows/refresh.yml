name: Refresh playlists

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iptv-state-writer
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg + jq
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg jq

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Make scripts executable
        run: chmod +x scripts/test_stream.sh scripts/refresh.py

      - name: Refresh playlists
        run: python3 scripts/refresh.py

      - name: Maintain the IPTVX French cloud alias
        run: cp claudette-france.m3u claude-france.m3u

      - name: Commit & push if changed
        run: |
          git add claudette-usa.m3u claudette-france.m3u claudette-algeria.m3u claudette-us-news.m3u claude-france.m3u
          if ! git diff --cached --quiet; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Auto-refresh: verified streams, dropped dead URLs ($(date -u +%FT%TZ))"
            git pull --rebase
            git push
          else
            echo "No changes; streams all still playing."
          fi
