name: Audit self-healing French channels

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: french-self-healing-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install real playback tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg jq
          chmod +x scripts/test_stream.sh

      - name: Three-pass moving-media audit of every French channel
        id: playback
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/check_french_top20_playback.py \
            2>&1 | tee french-self-healing-audit.txt

      - name: Preserve audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: french-self-healing-${{ github.run_id }}
          path: french-self-healing-audit.txt
          retention-days: 30

      - name: Report persistent channel failures
        if: always()
        env:
          PLAYBACK_OUTCOME: ${{ steps.playback.outcome }}
        run: |
          if [ "$PLAYBACK_OUTCOME" != "success" ]; then
            echo "One or more French channels failed all required live gates."
            exit 1
          fi
          echo "Every French channel passed three independent moving-media gates."
