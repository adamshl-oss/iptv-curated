name: Audit self-healing French channels

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  # The serial watchdog is the sole unattended dispatcher. This per-workflow
  # guard only prevents accidental duplicate French audits.
  group: french-self-healing-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install real playback tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg jq
          chmod +x scripts/test_stream.sh
          chmod +x scripts/sustained_stream_gate.py
          python3 -m unittest \
            scripts/test_reconcile_self_healing.py \
            scripts/test_sustained_stream_gate.py

      - name: Audit, quarantine, recover, and rebuild
        id: reconcile
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/reconcile_self_healing.py \
            --country france \
            --apply \
            2>&1 | tee french-self-healing-audit.txt

      - name: Publish controller state and playlist changes
        id: publish
        run: |
          if git diff --quiet -- \
            french-tv-top20-july-2026.m3u \
            french-tv-july-2026-v5.m3u \
            iptv-coverage-status.json \
            scripts/french_top20_target.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            french-tv-top20-july-2026.m3u \
            french-tv-july-2026-v5.m3u \
            iptv-coverage-status.json \
            scripts/french_top20_target.json
          git commit -m "Reconcile French channel health ($(date -u +%FT%TZ))"
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Wait for public playlist publication
        if: steps.publish.outputs.changed == 'true'
        run: |
          for playlist in \
            french-tv-top20-july-2026.m3u \
            french-tv-july-2026-v5.m3u \
            iptv-coverage-status.json; do
            local_hash="$(sha256sum "$playlist" | cut -d' ' -f1)"
            public_url="https://adamshl-oss.github.io/iptv-curated/$playlist"
            for attempt in $(seq 1 24); do
              remote_hash="$(
                curl -fsSL "${public_url}?sync=$(date -u +%s%N)" |
                  sha256sum |
                  cut -d' ' -f1
              )"
              [ "$remote_hash" = "$local_hash" ] && break
              [ "$attempt" -eq 24 ] && exit 1
              sleep 10
            done
          done

      - name: Preserve audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: french-self-healing-${{ github.run_id }}
          path: french-self-healing-audit.txt
          retention-days: 30

      - name: Launch replacement discovery when coverage is degraded
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! grep -q $'^COVERAGE_DEGRADED\tfrance\t' \
            french-self-healing-audit.txt; then
            echo "French target coverage is complete."
            exit 0
          fi

          active="$(
            gh api \
              "repos/$GH_REPO/actions/workflows/discover-channel-sources.yml/runs?branch=main&per_page=20" \
              --jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress")]
                | length'
          )"
          if [ "$active" -gt 0 ]; then
            echo "Replacement discovery is already active."
            exit 0
          fi

          latest_success="$(
            gh api \
              "repos/$GH_REPO/actions/workflows/discover-channel-sources.yml/runs?branch=main&status=success&per_page=1" \
              --jq '.workflow_runs[0].created_at // ""'
          )"
          if [ -n "$latest_success" ]; then
            age="$(( $(date -u +%s) - $(date -u -d "$latest_success" +%s) ))"
            if [ "$age" -le 1200 ]; then
              echo "Replacement discovery completed ${age}s ago; no duplicate launched."
              exit 0
            fi
          fi

          gh workflow run discover-channel-sources.yml \
            --repo "$GH_REPO" \
            --ref main
          echo "Replacement discovery launched immediately."

      - name: Pressure-test public source failover
        run: |
          check_failover() {
            channel="$1"
            expected_source="$2"
            headers="$(mktemp)"
            body="$(mktemp)"
            status="$(curl -sS --max-time 30 -D "$headers" -o "$body" -w '%{http_code}' \
              "https://algerian-tv-relay-2026.espiiem.chatgpt.site/api/qa/failover/france/${channel}?mode=primary-down")"
            [ "$status" = "200" ]
            grep -qi "^x-iptvx-source: ${expected_source}" "$headers"
            grep -q '^#EXTM3U' "$body"
          }
          check_failover bfmtv sfr-authorized
          check_failover lequipe samsung-cloudfront
          check_failover rmc-life samsung-official-bootstrap

          status="$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' \
            'https://algerian-tv-relay-2026.espiiem.chatgpt.site/api/qa/failover/france/bfmtv?mode=all-down')"
          [ "$status" = "503" ]

      - name: Report controller result
        if: always()
        env:
          RECONCILE_OUTCOME: ${{ steps.reconcile.outcome }}
        run: |
          coverage_line="$(grep $'^COVERAGE_.*\tfrance\t' french-self-healing-audit.txt | tail -1)"
          playback_line="$(grep $'^PLAYBACK_.*\tfrance\t' french-self-healing-audit.txt | tail -1)"
          outcome_line="$(grep $'^OUTCOME_.*\tfrance\t' french-self-healing-audit.txt | tail -1)"
          {
            echo "## French playback and target coverage"
            echo
            echo '```'
            echo "$playback_line"
            echo "$outcome_line"
            echo "$coverage_line"
            echo '```'
            echo
            echo "A green run means the controller worked. Coverage and sustained quality are reported separately above."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$RECONCILE_OUTCOME" != "success" ]; then
            echo "The French controller itself failed unexpectedly."
            exit 1
          fi
          if ! grep -Eq $'^PLAYBACK_(HEALTHY|SURVIVORS_HEALTHY)\tfrance\t' \
            french-self-healing-audit.txt; then
            echo "Published French playback remains degraded."
            exit 1
          fi
          if grep -q $'^COVERAGE_COMPLETE\tfrance\t' french-self-healing-audit.txt; then
            echo "French coverage is complete."
          else
            echo "::warning::$coverage_line"
            echo "Playback automation is operational; French target coverage remains degraded."
          fi
