name: Refresh French cloud channels

on:
  schedule:
    - cron: "10,30,50 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: playlist-write
  cancel-in-progress: false

jobs:
  refresh-french-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install playback tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg jq
          chmod +x scripts/test_stream.sh

      - name: Test and repair French sources
        run: python3 scripts/refresh_french_cloud.py

      - name: Verify every candidate entry with real playback
        id: local_check
        continue-on-error: true
        run: python3 scripts/check_french_playback.py french-tv-july-2026-v3.m3u

      - name: Commit and push verified failovers
        run: |
          if ! git diff --quiet -- french-tv-july-2026-v2.m3u french-tv-july-2026-v3.m3u; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add french-tv-july-2026-v2.m3u french-tv-july-2026-v3.m3u
            git commit -m "Refresh French cloud feeds ($(date -u +%FT%TZ))"
            git pull --rebase
            git push
          else
            echo "French cloud URLs are still healthy."
          fi

      - name: Wait for the public cloud copy
        run: |
          local_hash="$(sha256sum french-tv-july-2026-v3.m3u | cut -d' ' -f1)"
          public_url="https://adamshl-oss.github.io/iptv-curated/french-tv-july-2026-v3.m3u"
          for attempt in $(seq 1 24); do
            remote_hash="$(
              curl -fsSL "${public_url}?sync=$(date -u +%s)" |
                sha256sum |
                cut -d' ' -f1
            )"
            if [ "$remote_hash" = "$local_hash" ]; then
              echo "Public French playlist is current."
              exit 0
            fi
            sleep 10
          done
          echo "Public French playlist did not update within four minutes."
          exit 1

      - name: Verify the public Apple TV playlist
        id: public_check
        continue-on-error: true
        run: python3 scripts/check_french_playback.py

      - name: Enforce complete French playlist health
        if: always()
        env:
          LOCAL_OUTCOME: ${{ steps.local_check.outcome }}
          PUBLIC_OUTCOME: ${{ steps.public_check.outcome }}
        run: |
          if [ "$LOCAL_OUTCOME" != "success" ] ||
             [ "$PUBLIC_OUTCOME" != "success" ]; then
            echo "At least one French channel failed real playback validation."
            exit 1
          fi
