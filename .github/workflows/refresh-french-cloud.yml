name: Audit self-healing French channels

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: french-self-healing-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install real playback tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg jq
          chmod +x scripts/test_stream.sh

      - name: Audit, quarantine, recover, and rebuild
        id: reconcile
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/reconcile_self_healing.py \
            --country france \
            --apply \
            2>&1 | tee french-self-healing-audit.txt

      - name: Publish controller state and playlist changes
        id: publish
        run: |
          if git diff --quiet -- \
            french-tv-top20-july-2026.m3u \
            french-tv-july-2026-v5.m3u \
            scripts/french_top20_target.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            french-tv-top20-july-2026.m3u \
            french-tv-july-2026-v5.m3u \
            scripts/french_top20_target.json
          git commit -m "Reconcile French channel health ($(date -u +%FT%TZ))"
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Wait for public playlist publication
        if: steps.publish.outputs.changed == 'true'
        run: |
          for playlist in \
            french-tv-top20-july-2026.m3u \
            french-tv-july-2026-v5.m3u; do
            local_hash="$(sha256sum "$playlist" | cut -d' ' -f1)"
            public_url="https://adamshl-oss.github.io/iptv-curated/$playlist"
            for attempt in $(seq 1 24); do
              remote_hash="$(
                curl -fsSL "${public_url}?sync=$(date -u +%s%N)" |
                  sha256sum |
                  cut -d' ' -f1
              )"
              [ "$remote_hash" = "$local_hash" ] && break
              [ "$attempt" -eq 24 ] && exit 1
              sleep 10
            done
          done

      - name: Preserve audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: french-self-healing-${{ github.run_id }}
          path: french-self-healing-audit.txt
          retention-days: 30

      - name: Report controller result
        if: always()
        env:
          RECONCILE_OUTCOME: ${{ steps.reconcile.outcome }}
        run: |
          if [ "$RECONCILE_OUTCOME" != "success" ]; then
            echo "A French channel failed its first complete gate; the next run will quarantine it if the failure persists."
            exit 1
          fi
          echo "Every published French channel passed or was safely quarantined."
